name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build PickleRef IPA (iOS 15+)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert WASB ball detector to Core ML
        id: wasb
        continue-on-error: true
        run: |
          pip install -q "torch==2.5.1" "coremltools==8.3.0" "numpy<2" pyyaml pillow
          git clone -q --depth 1 https://github.com/nttcom/WASB-SBDT.git /tmp/wasb
          python tools/convert_wasb.py /tmp/wasb tools/weights/wasb_tennis_best.pth.tar /tmp/WASB.mlpackage
          mkdir -p ios/Models
          xcrun coremlcompiler compile /tmp/WASB.mlpackage ios/Models
          ls -la ios/Models ios/Models/WASB.mlmodelc

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          cd /tmp && unzip -q xcodegen.zip -d xcgen
          echo "/tmp/xcgen/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate project
        run: cd ios && xcodegen generate --spec project.yml

      - name: Build (Release, device, unsigned)
        run: |
          cd ios
          xcodebuild -project PickleRef.xcodeproj -scheme PickleRef \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build clean build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/PickleRef.app

      - name: Package IPA
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/PickleRef.app
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          ls "$APP" | head -50
          mkdir -p Payload && cp -R "$APP" Payload/
          SHA=$(git rev-parse --short HEAD)
          zip -qr "PickleRef-$SHA.ipa" Payload
          ls -la *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PickleRef-ipa
          path: PickleRef-*.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7

  test:
    name: Unit tests (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          cd /tmp && unzip -q xcodegen.zip -d xcgen
          echo "/tmp/xcgen/xcodegen/bin" >> $GITHUB_PATH
      - name: Generate project
        run: |
          mkdir -p ios/Models/WASB.mlmodelc   # placeholder; tests don't need the neural model
          cd ios && xcodegen generate --spec project.yml
      - name: Test
        run: |
          cd ios
          SIM_ID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '\([0-9A-F-]{36}\)' | tr -d '()')
          echo "sim: $SIM_ID"
          set -o pipefail
          xcodebuild test -project PickleRef.xcodeproj -scheme PickleRef \
            -destination "platform=iOS Simulator,id=$SIM_ID" CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case.*(passed|failed)|XCTAssert|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ios/test.log
          retention-days: 7
